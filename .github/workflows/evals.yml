name: evals
on: [push]

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Start backend
        working-directory: backend
        run: nohup python -m uvicorn main:api --host 127.0.0.1 --port 8000 > server.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:8000/docs > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start"
          cat backend/server.log
          exit 1

      - name: Run evals
        run: |
          python evals/run_evals.py --fail-under 0.75 || {
            echo ""
            echo "=========== SERVER LOG (last 60 lines) ==========="
            tail -n 60 backend/server.log
            exit 1
          }